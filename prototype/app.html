<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brickwork Payments</title>
<meta name="description" content="Eurogold bricklayer claims: allowance check, photos, foreman and QS sign-off, live plot ledger and weekly payment run.">
<style>
:root {
  --bg: #f5f4ef; --surface: #ffffff; --surface-2: #f0eee7; --ink: #1b2130; --muted: #5c6472; --line: #e1ddd2;
  --brand: #1d2a44; --brand-ink: #ffffff; --accent: #d9a200; --accent-soft: #fbf1cf;
  --ok: #1d7a4b; --ok-soft: #e2f3ea; --warn: #9a5b00; --warn-soft: #fbedd5; --bad: #b42318; --bad-soft: #fde5e2;
  --info: #2457a6; --info-soft: #e3ecfa; --shadow: 0 1px 2px rgba(20,24,36,.06), 0 4px 14px rgba(20,24,36,.05);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1f29; --surface-2: #222835; --ink: #e8eaf0; --muted: #9aa3b2; --line: #2e3544;
    --brand: #0e1524; --brand-ink: #f2f3f6; --accent: #e8b52a; --accent-soft: #3a3115;
    --ok: #4cc58a; --ok-soft: #173326; --warn: #f0a640; --warn-soft: #3a2a12; --bad: #ff7a6b; --bad-soft: #3d1c1a;
    --info: #7fa8ff; --info-soft: #1b2741; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --surface-2: #222835; --ink: #e8eaf0; --muted: #9aa3b2; --line: #2e3544;
  --brand: #0e1524; --brand-ink: #f2f3f6; --accent: #e8b52a; --accent-soft: #3a3115;
  --ok: #4cc58a; --ok-soft: #173326; --warn: #f0a640; --warn-soft: #3a2a12; --bad: #ff7a6b; --bad-soft: #3d1c1a;
  --info: #7fa8ff; --info-soft: #1b2741; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--info); }
h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
h3 { font-size: .95rem; margin: 0 0 .5rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Header */
.top { background: var(--brand); color: var(--brand-ink); position: sticky; top: 0; z-index: 20; }
.top-inner { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; margin-right: auto; }
.logo .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #1d2a44; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.logo small { display: block; font-weight: 500; opacity: .75; font-size: .75rem; letter-spacing: 0; }
.who { display: flex; gap: 6px; align-items: center; font-size: .85rem; }
.who select { background: rgba(255,255,255,.1); color: inherit; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 8px; font: inherit; max-width: 46vw; }
.who select option { color: #1b2130; }
.tabs { max-width: 1040px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
.tabs a { color: var(--brand-ink); opacity: .75; text-decoration: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a.on { opacity: 1; border-color: var(--accent); }
.demo-strip { background: var(--accent-soft); color: var(--ink); font-size: .8rem; text-align: center; padding: 5px 16px; }

main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 80px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; min-width: 0; }
.card.tight { padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .82rem; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }

/* Buttons & inputs */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 42px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
:root[data-theme="dark"] .btn.primary { background: var(--accent); color: #1b2130; border-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--accent); color: #1b2130; border-color: var(--accent); } }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.big { width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=number], input[type=search], textarea, select.field { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; }
input:focus, textarea:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { min-height: 70px; resize: vertical; }
label.lbl { display: block; font-weight: 600; font-size: .85rem; margin: 10px 0 4px; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; letter-spacing: .01em; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--info); }
.chip.gold { background: var(--accent-soft); color: var(--warn); }

/* Lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: inherit; }
.item:hover { border-color: var(--muted); }
.item .main { flex: 1; min-width: 0; }
.item .main b { display: block; }
.item .side { text-align: right; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { background: var(--surface-2); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.over, .t-over { color: var(--bad); font-weight: 700; }
td.noallow { color: var(--warn); }
tfoot td { font-weight: 700; background: var(--surface-2); }

.bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; min-width: 60px; display: flex; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar i.p { background: var(--accent); }
.bar.over i { background: var(--bad); }

/* Claim form */
.step { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
:root[data-theme="dark"] .step .n { background: var(--accent); color: #1b2130; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step .n { background: var(--accent); color: #1b2130; } }
.qty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.qty { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.qty label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: 4px; }
.qty .pair { display: flex; gap: 6px; }
.qty .pair input { padding: 8px; }
.qty .pair input.c { width: 64px; flex: none; }
.qty small { color: var(--muted); font-size: .72rem; }
.qty.has { border-color: var(--accent); background: var(--accent-soft); }
.yn { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.yn label { padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: .85rem; background: var(--surface); }
.yn input { position: absolute; opacity: 0; pointer-events: none; }
.yn input:checked + span { color: #fff; }
.yn label:has(input[value=yes]:checked) { background: var(--ok); color: #fff; }
.yn label:has(input[value=no]:checked) { background: var(--bad); color: #fff; }
.check-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check-row:last-child { border-bottom: none; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.photo button { position: absolute; top: 4px; right: 4px; border: 0; background: rgba(0,0,0,.6); color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1; }
.addphoto { aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 9px; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer; padding: 6px; }
.addphoto:hover { border-color: var(--accent); color: var(--ink); }
.plotchips { display: flex; flex-wrap: wrap; gap: 6px; }
.alert { border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 10px 0; border: 1px solid transparent; }
.alert.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--info-soft); color: var(--info); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.sticky-total { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); margin: 14px -16px -16px; padding: 12px 16px; border-radius: 0 0 var(--radius) var(--radius); }
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { padding: 6px 0 6px 18px; position: relative; font-size: .88rem; }
.timeline li::before { content: ""; position: absolute; left: 3px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }

/* Modal / toast */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 600; }
.right { margin-left: auto; }
@media (max-width: 560px) {
  h1 { font-size: 1.2rem; }
  .hide-sm { display: none; }
  .card { padding: 14px; }
  .sticky-total { margin: 14px -14px -14px; }
  th, td { padding: 7px 5px; }
  th { font-size: .66rem; letter-spacing: .02em; }
  table { font-size: .8rem; }
  .card { padding: 12px; }
  .sticky-total { margin: 14px -12px -12px; }
}
@media print {
  .top, .demo-strip, .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border-color: #bbb; break-inside: avoid; }
  main { padding: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo"><div class="mark">EG</div><div>Brickwork Payments<small id="siteName"></small></div></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="demo-strip">Prototype with real EG587 data. Use "Viewing as" to switch between bricklayer, foreman, QS and Accounts. Changes are saved on this device only.</div>
<main id="app"></main>
<div id="layer"></div>

<script src="data.js"></script>
<script>
"use strict";
const SEED = window.SEED;
const ITEMS = SEED.items;
const ITEM = Object.fromEntries(ITEMS.map(i => [i.key, i]));
const COURSE_ITEMS = ["t355", "t300", "b140", "b100", "commons", "facings"];
const POOLS = [
  { key: "trench", label: "Trench block", items: ["t355", "t300"] },
  { key: "commons", label: "Commons", items: ["commons"] },
  { key: "facings", label: "Facings / eng.", items: ["facings"] },
  { key: "b100", label: "100mm block", items: ["b100"] },
  { key: "b140", label: "140mm block", items: ["b140"] },
];
const POOL = Object.fromEntries(POOLS.map(p => [p.key, p]));
const POOL_OF = {}; POOLS.forEach(p => p.items.forEach(i => POOL_OF[i] = p.key));
const NO_POOL_ITEMS = ITEMS.map(i => i.key).filter(k => !POOL_OF[k]);
const PLOT = Object.fromEntries(SEED.plots.map(p => [p.no, p]));
const BRICK_CHECKS = [
  ["concrete", "Concrete to foundation to an acceptable working level"],
  ["depth", "Foundation to a workable depth"],
  ["nails", "Engineer's nails checked and within tolerance"],
  ["drawing", "Relevant foundation drawing issued"],
];
const FOREMAN_CHECKS = [
  ["standard", "Block and brickwork built to an excellent standard"],
  ["levels", "Brickwork levels checked and within tolerance"],
  ["lengths", "Brickwork lengths checked and within tolerance"],
  ["diagonals", "Brickwork diagonals checked and within tolerance"],
  ["mortarTop", "Top of brickwork filled in with mortar"],
  ["cavities", "Cavities free from mortar"],
  ["drainage", "Drainage ducting installed to drawing"],
];
const STATUS = {
  draft: ["Draft", ""],
  submitted: ["Waiting for foreman", "info"],
  foreman_approved: ["Waiting for QS", "gold"],
  approved: ["Approved, in ledger", "ok"],
  rejected: ["Rejected, needs fixing", "bad"],
};
const ROLES = { bricklayer: "Bricklayer", foreman: "Foreman", qs: "QS", accounts: "Accounts" };
const STORE_KEY = "eg-brickwork-payments-v1";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const fq = v => { v = Math.round(n(v) * 100) / 100; return v.toLocaleString("en-GB", { maximumFractionDigits: 2 }); };
const money = v => "£" + n(v).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = x => String(x).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fdate = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const fdt = iso => { const d = new Date(iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); };
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
let storageOk = true;
function demoClaims() {
  const ago = h => new Date(Date.now() - h * 3600e3).toISOString();
  const ph = SEED.demoPhotos;
  const yes = keys => Object.fromEntries(keys.map(([k]) => [k, "yes"]));
  return [
    {
      id: "BP-0001", demo: true, site: SEED.site.code, bricklayer: "John Dolan", createdAt: ago(20), status: "submitted",
      plots: [{ no: 7, qty: { t300: 151, commons: 120, facings: 904, lintels: 22, pipes: 4, vents: 14 }, courses: { t300: 2, commons: 3, facings: 6 }, reasons: {}, photos: [ph[0], ph[1]] }],
      checks: yes(BRICK_CHECKS), checkNote: "", split: [{ name: "John Dolan", pct: 50 }, { name: "Matthew Rankin", pct: 50 }],
      note: "", signedName: "John Dolan", history: [{ at: ago(20), by: "John Dolan", action: "Submitted" }],
    },
    {
      id: "BP-0002", demo: true, site: SEED.site.code, bricklayer: "Jason Webb", createdAt: ago(52), status: "foreman_approved",
      plots: [{ no: 8, qty: { t300: 151, commons: 140, facings: 904, lintels: 22, pipes: 4, vents: 14 }, courses: { t300: 2, commons: 3, facings: 6 },
        reasons: { commons: "Extra course of commons under the vents on the rear elevation. Agreed with the foreman on site." }, photos: [ph[2]] }],
      checks: yes(BRICK_CHECKS), checkNote: "", split: [], note: "", signedName: "Jason Webb",
      foreman: { name: "Site Foreman", at: ago(30), checks: yes(FOREMAN_CHECKS), comment: "Checked on site. The extra course of commons is genuine." },
      history: [{ at: ago(52), by: "Jason Webb", action: "Submitted" }, { at: ago(30), by: "Site Foreman", action: "Foreman approved", note: "Checked on site. The extra course of commons is genuine." }],
    },
  ];
}
function fresh() {
  return {
    seq: 2, user: { role: "bricklayer", name: "John Dolan" },
    staffNames: { foreman: "Site Foreman", qs: "QS", accounts: "Accounts" },
    rates: clone(SEED.rates), allowanceOverrides: {}, claims: demoClaims(), draft: null,
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.claims)) return s; } catch (e) { /* fall through */ }
  return fresh();
}
let S = load();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; toast("This device's storage is full. Changes will be lost when you close the page."); }
}

/* ---------- domain ---------- */
const bricklayers = () => Object.keys(S.rates).filter(k => k !== "STANDARD").sort((a, b) => a.localeCompare(b));
const rateFor = (who, item) => n((S.rates[who] || S.rates.STANDARD || {})[item]);
const allowanceOf = no => ({ ...PLOT[no].allowance, ...(S.allowanceOverrides[no] || {}) });
const live = c => ["submitted", "foreman_approved"].includes(c.status);
function qtyOf(c, no) {
  const p = c.plots.find(x => x.no == no); if (!p) return null;
  return (c.qs && c.qs.qty && c.qs.qty[no]) || p.qty;
}
function usage(no, excludeId) {
  const approved = {}, pending = {};
  const add = (o, q) => Object.entries(q || {}).forEach(([k, v]) => o[k] = (o[k] || 0) + n(v));
  add(approved, PLOT[no].opening);
  for (const c of S.claims) {
    if (c.id === excludeId) continue;
    const q = qtyOf(c, no); if (!q) continue;
    if (c.status === "approved") add(approved, q); else if (live(c)) add(pending, q);
  }
  return { approved, pending };
}
const poolSum = (q, pool) => POOL[pool].items.reduce((a, i) => a + n((q || {})[i]), 0);
function checkPlot(no, excludeId, mine = {}) {
  const a = allowanceOf(no), u = usage(no, excludeId);
  const pools = POOLS.map(p => {
    const allow = n(a[p.key]), appr = poolSum(u.approved, p.key), pend = poolSum(u.pending, p.key), me = poolSum(mine, p.key);
    const left = allow - appr - pend - me;
    const state = me <= 0 ? "none" : allow <= 0 ? "noallow" : left < 0 ? "over" : "ok";
    return { ...p, allow, appr, pend, me, left, state };
  });
  const extras = NO_POOL_ITEMS.filter(k => n(mine[k]) > 0).map(k => ({ key: k, label: ITEM[k].label, me: n(mine[k]), appr: n(u.approved[k]), pend: n(u.pending[k]) }));
  return { pools, extras, usage: u };
}
function claimFlags(c) {
  const over = [], noallow = [];
  c.plots.forEach(p => {
    const r = checkPlot(p.no, c.id, qtyOf(c, p.no));
    r.pools.forEach(x => { if (x.state === "over") over.push({ plot: p.no, pool: x.key, by: -x.left }); if (x.state === "noallow") noallow.push({ plot: p.no, pool: x.key }); });
  });
  return { over, noallow };
}
function claimValue(c) {
  let total = 0;
  c.plots.forEach(p => Object.entries(qtyOf(c, p.no)).forEach(([k, v]) => total += n(v) * rateFor(c.bricklayer, k)));

}

function payRun(iso) {

}

  if (a === "rmphoto") { const no = +b.dataset.no; draft.plots.find(x => x.no === no).photos.splice(+b.dataset.i, 1); renderPhotos(no); }
  if (a === "addsplit") { draft.split.push({ name: "", pct: 0 }); renderSplit(); }

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1100 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);

}
function submitDraft() {

  BRICK_CHECKS.forEach(([k, t]) => { if (!draft.checks[k]) errs.push(`Answer the check: "${t}".`); });
  if (BRICK_CHECKS.some(([k]) => draft.checks[k] === "no") && !draft.checkNote.trim()) errs.push("Explain the check you answered No to.");
  if (draft.useSplit) {

  if (errs.length) { $("#errors").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const plots = draft.plots.map(p => ({ no: p.no, qty: p.qty, courses: p.courses, photos: p.photos, reasons: Object.fromEntries(overPools(p.no).map(x => [x.key, p.reasons[x.key]])) }));
  const now = new Date().toISOString();
  let c;

    c = S.claims.find(x => x.id === draft.editing);
    Object.assign(c, { plots, checks: draft.checks, checkNote: draft.checkNote, split: draft.useSplit ? draft.split : [], note: draft.note, signedName: draft.signedName, status: "submitted", foreman: null, qs: null });
    c.history.push({ at: now, by: S.user.name, action: "Resubmitted" });
  } else {
    c = { id: nextId(), site: SEED.site.code, bricklayer: S.user.name, createdAt: now, status: "submitted", plots, checks: draft.checks, checkNote: draft.checkNote,
      split: draft.useSplit ? draft.split : [], note: draft.note, signedName: draft.signedName, history: [{ at: now, by: S.user.name, action: "Submitted" }] };
    S.claims.push(c); S.draft = null;
  }
  save(); draft = null;
  toast(`${c.id} sent to the foreman`); location.hash = "#/claim/" + c.id;
}

    <p class="muted">${esc(P.foundation)} foundation${P.extraCourse ? ` · 1 extra course of trench block = ${fq(P.extraCourse)}` : ""}</p>
    <section class="card"><div class="spread"><h2 style="margin:0">Allowance vs booked</h2>${isQS ? `<button class="btn sm" id="editAllow" type="button">Edit allowance</button>` : ""}</div>
      <div style="margin-top:10px">${calcTable(no, { pools: x.r.pools, extras: NO_POOL_ITEMS.filter(k => x.r.usage.approved[k] || x.r.usage.pending[k]).map(k => ({ key: k, label: ITEM[k].label, me: 0, appr: n(x.r.usage.approved[k]), pend: n(x.r.usage.pending[k]) })) }, false)}</div>
      <div id="allowEdit"></div>
      ${S.allowanceOverrides[no] ? `<p class="small muted">Allowance changed by the QS from the tender figures.</p>` : ""}</section>
    <section class="card"><h2>Bookings</h2>
      ${claims.length ? `<div class="list">${claims.map(claimRow).join("")}</div>` : ""}
      ${opening.length ? `<div class="card tight" style="margin:10px 0 0;box-shadow:none"><b>Brought forward from the Excel ledger</b>
        <div class="muted small">${P.openingClaims.map(h => `${esc(h.by)} ${h.date ? "(" + fdate(h.date) + ")" : ""}`).join(" · ") || "Earlier claims"}</div>
        <div class="row small" style="margin-top:6px;gap:6px">${opening.map(([k, v]) => `<span class="chip">${esc(ITEM[k].label)}: ${fq(v)}</span>`).join("")}</div>
        ${fixes.length ? `<div class="alert warn small">Typed as text in Excel, so missing from its totals: ${fixes.map(f => `${esc(ITEM[f.item].label)} "${esc(f.text)}"`).join(", ")}.</div>` : ""}</div>` : ""}
      ${!claims.length && !opening.length ? `<div class="empty">Nothing booked on this plot yet.</div>` : ""}</section>`;
  if (isQS) $("#editAllow").onclick = () => {
    $("#allowEdit").innerHTML = `<div class="qty-grid" style="margin-top:12px">${POOLS.map(p => `<div class="qty"><label for="al-${p.key}">${esc(p.label)}</label><input type="number" min="0" id="al-${p.key}" value="${n(a[p.key])}"><small>Tender: ${fq(P.allowance[p.key])}</small></div>`).join("")}</div>
      <div class="row" style="margin-top:10px"><button class="btn primary sm" id="saveAllow" type="button">Save allowance</button><button class="btn sm" id="resetAllow" type="button">Back to tender figures</button></div>`;
    $("#saveAllow").onclick = () => { S.allowanceOverrides[no] = Object.fromEntries(POOLS.map(p => [p.key, n($(`#al-${p.key}`).value)])); save(); toast("Allowance saved"); route(); };
    $("#resetAllow").onclick = () => { delete S.allowanceOverrides[no]; save(); route(); };
  };
  app.oninput = null; app.onchange = null; app.onclick = null;
}

/* ---------- payments ---------- */
function viewPayments(app, runArg) {
  if (!["qs", "accounts"].includes(S.user.role)) { app.innerHTML = `<div class="empty">Payment runs are for the QS and Accounts.</div>`; return; }
  const appr = S.claims.filter(c => c.status === "approved");
  const thisRun = payRun(new Date().toISOString());
  const runs = [...new Set([thisRun, ...appr.map(c => payRun(c.qs.at))])].sort().reverse();
  const run = runArg && runs.includes(runArg) ? runArg : thisRun;
  const inRun = appr.filter(c => payRun(c.qs.at) === run);
  const by = {};
  inRun.forEach(c => payees(c).forEach(p => { (by[p.name] = by[p.name] || { amount: 0, claims: [] }); by[p.name].amount += p.amount; by[p.name].claims.push(c.id + (p.pct < 100 ? ` (${fq(p.pct)}%)` : "")); }));
  const total = Object.values(by).reduce((a, x) => a + x.amount, 0);
  const cutoff = new Date(run + "T10:00:00");
  app.innerHTML = `<h1>Payment run</h1>
    <p class="muted">Every claim the QS approves before Thursday 10:00 goes into that Thursday's run, already signed off by the bricklayer, foreman and QS. This replaces the stapled pack.</p>
    <div class="row noprint" style="margin-bottom:12px"><select class="field" id="runSel" style="width:auto" aria-label="Payment run">${runs.map(r => `<option value="${r}" ${r === run ? "selected" : ""}>Thursday ${fdate(r)}${r === thisRun ? " (next run)" : ""}</option>`).join("")}</select>
      <button class="btn sm" id="pcsv" type="button">Export CSV</button><button class="btn sm" type="button" onclick="print()">Print</button></div>
    <div class="stats"><div class="stat"><b>${money(total)}</b><span>Total to pay</span></div><div class="stat"><b>${Object.keys(by).length}</b><span>People</span></div><div class="stat"><b>${inRun.length}</b><span>Claims</span></div>
      <div class="stat"><b class="small" style="font-size:1rem">${cutoff.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })} 10:00</b><span>Cut-off</span></div></div>
    <section class="card"><h2>By person</h2>${Object.keys(by).length ? `<div class="tablewrap"><table><thead><tr><th>Paid to</th><th>Claims</th><th class="num">Amount</th></tr></thead>
      <tbody>${Object.entries(by).sort().map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td class="small">${esc(v.claims.join(", "))}</td><td class="num">${money(v.amount)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="num">${money(total)}</td></tr></tfoot></table></div>` : `<div class="empty">Nothing approved for this run yet. Claims show up here as soon as the QS approves them.</div>`}</section>
    ${inRun.length ? `<section class="card"><h2>Claims in this run</h2><div class="tablewrap"><table><thead><tr><th>Claim</th><th>Bricklayer</th><th>Plots</th><th>Approved</th><th class="num">Value</th></tr></thead>
      <tbody>${inRun.map(c => `<tr class="click" onclick="location.hash='#/claim/${c.id}'"><td>${esc(c.id)}</td><td>${esc(c.bricklayer)}</td><td>${esc(plotsLabel(c))}</td><td class="small">${esc(c.foreman.name)} / ${esc(c.qs.name)}</td><td class="num">${money(claimValue(c))}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
  $("#runSel").onchange = e => location.hash = "#/payments/" + e.target.value;
  $("#pcsv").onclick = () => {
    const rows = [["Payment run", "Claim", "Site", "Plots", "Bricklayer", "Paid to", "Share %", "Amount", "Foreman", "QS", "Approved"]];
    inRun.forEach(c => payees(c).forEach(p => rows.push([run, c.id, SEED.site.code, plotsLabel(c), c.bricklayer, p.name, p.pct, p.amount.toFixed(2), c.foreman.name, c.qs.name, fdt(c.qs.at)])));
    download(`payment-run-${run}.csv`, toCsv(rows));
  };
  app.oninput = null; app.onchange = null; app.onclick = null;
}

/* ---------- settings ---------- */
function viewSettings(app) {
  if (S.user.role !== "qs") { app.innerHTML = `<div class="empty">Settings are for the QS.</div>`; return; }
  const cols = ITEMS.map(i => i.key).concat("daywork");
  const lab = k => k === "daywork" ? "Daywork / hr" : ITEM[k].label;
  app.innerHTML = `<h1>Rates and setup</h1>
    <section class="card"><h2>Bricklayer rates</h2><p class="muted small">From "Up To Date Bricky Rates". Changes apply to claims that haven't been approved yet. STANDARD is used for anyone not on the list.</p>
      <div class="tablewrap"><table><thead><tr><th>Bricklayer</th>${cols.map(k => `<th class="num">${esc(lab(k))}</th>`).join("")}</tr></thead>
      <tbody>${Object.keys(S.rates).sort((a, b) => a === "STANDARD" ? -1 : b === "STANDARD" ? 1 : a.localeCompare(b)).map(name => `<tr><td><b>${esc(name)}</b></td>${cols.map(k => `<td><input type="number" step="0.01" min="0" data-rn="${esc(name)}" data-rk="${k}" value="${n(S.rates[name][k])}" style="width:72px;text-align:right;padding:6px" aria-label="${esc(name)} ${esc(lab(k))}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:10px"><input type="text" id="newB" placeholder="New bricklayer name" style="max-width:260px"><button class="btn sm" id="addB" type="button">Add (starts on STANDARD rates)</button></div></section>
    <section class="card"><h2>Site data</h2><dl class="kv"><dt>Site</dt><dd>${esc(SEED.site.code)} ${esc(SEED.site.name)}</dd><dt>Client</dt><dd>${esc(SEED.site.client)}</dd><dt>Plots</dt><dd>${SEED.plots.length}, from ${esc(SEED.site.ledgerRef)}</dd><dt>Allowance edits</dt><dd>${Object.keys(S.allowanceOverrides).length} plot(s)</dd></dl>
      <p class="muted small">In the full version, a new site is set up by uploading its house type list and drawing measures.</p></section>
    <section class="card"><h2>Demo data</h2><p class="muted small">Everything in this prototype is saved on this device only. Reset to go back to the starting data and the two demo claims.</p>
      <button class="btn danger" id="reset" type="button">Reset demo data</button></section>`;
  app.oninput = e => { const t = e.target; if (t.dataset.rn) { S.rates[t.dataset.rn][t.dataset.rk] = n(t.value); save(); } };
  app.onchange = null; app.onclick = null;
  $("#addB").onclick = () => { const v = $("#newB").value.trim(); if (!v || S.rates[v]) return; S.rates[v] = clone(S.rates.STANDARD); save(); toast(v + " added"); route(); };
  $("#reset").onclick = () => { if (confirm("Reset all claims, rates and allowances to the starting data?")) { S = fresh(); save(); toast("Demo data reset"); location.hash = "#/"; route(); } };
}

/* ---------- export ---------- */
function toCsv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n"); }
function download(name, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

route();
</script>
</body>
</html>
